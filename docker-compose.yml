name: print-convert

services:
  gateway:
    build: .
    image: print-convert-gateway:local
    env_file: .env
    environment:
      GOTENBERG_URL: http://gotenberg:3000
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    ports:
      # Loopback by default: Docker publishes ports around ufw, so only the reverse proxy should reach the gateway.
      - "${GATEWAY_PORT:-127.0.0.1:8080}:8080"
    volumes:
      - convert-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      gotenberg:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, engine]
    restart: unless-stopped
    stop_grace_period: 30s

  gotenberg:
    # LibreOffice-only variant: no Chromium, smaller image and attack surface.
    image: gotenberg/gotenberg:8.39.0-libreoffice
    command:
      - gotenberg
      - --api-timeout=90s
      - --libreoffice-restart-after=10
      - --libreoffice-auto-start=true
      - --log-std-format=json
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    networks: [engine]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    networks: [engine]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  edge: {}
  # internal: containers on this network cannot reach the internet, so a malicious document
  # that exploits LibreOffice has nowhere to send data.
  engine:
    internal: true

volumes:
  convert-data: {}
  redis-data: {}
